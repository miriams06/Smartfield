name: Validate S2.07

on:
  push:
    branches:
      - s2.07-daily-summary

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore .\Smartfield.sln --configfile .\NuGet.Config
      - name: Build
        run: dotnet build .\Smartfield.sln --no-restore
      - name: Test Application
        run: dotnet test .\SmartField.Application.Tests\SmartField.Application.Tests.csproj --no-build --no-restore
      - name: Test API
        run: dotnet test .\SmartField.Api.Tests\SmartField.Api.Tests.csproj --no-build --no-restore
